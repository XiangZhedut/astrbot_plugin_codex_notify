name: Source quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q main.py completion_monitor.py desktop_client.py remote_control.py tools tests
      - run: python tools/build_release.py --output dist
